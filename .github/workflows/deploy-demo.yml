name: Deploy demo

# Deploys the shared demo to Vercel with the Vercel CLI, in place of Vercel's Git integration.
# It runs only on a push to the `demo` branch, or by hand from the Actions tab. How to set it up
# and how to update the link: docs/runbooks/deploy-demo.md.

on:
  push:
    branches: [demo]
  workflow_dispatch:

# One deploy at a time; a newer push replaces one still running.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A demo that fails its own checks is never deployed. The browser tests stay local.
      - run: pnpm lint
      - run: pnpm type:check
      - run: pnpm test

      # Installed with npm, as Vercel's guide does: pnpm 10 refuses the CLI's install scripts.
      - name: Install the Vercel CLI
        run: npm install --global vercel@65.9.0

      - name: Pull the Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Supabase stays unset, so the app runs without auth and calls no outside host. The demo
      # flag turns on the notice and noindex.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_DEMO_DEPLOYMENT: "true"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
